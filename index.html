<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BurgerTime Arcade 2D</title>
  <meta name="description" content="Juego arcade clásico 2D de BurgerTime. Arma las 2 hamburguesas gigantes con sus 7 ingredientes completos esquivando a la salchicha." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #08090f;
      --arcade-frame: #161626;
      --accent-yellow: #f8cc1b;
      --accent-red: #e74c3c;
      --accent-green: #2ecc71;
      --text-white: #ffffff;
      --text-gray: #a0a0b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 8px;
    }

    /* Gabinete Arcade */
    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--arcade-frame);
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.85), 0 0 24px rgba(248, 204, 27, 0.12);
      border: 3px solid #28283e;
      max-width: 100%;
    }

    .arcade-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 6px;
    }

    .marquee-title {
      font-size: 15px;
      color: var(--accent-yellow);
      text-shadow: 2px 2px #000, 0 0 8px rgba(248, 204, 27, 0.5);
      letter-spacing: 1px;
    }

    .audio-toggle-btn {
      background: #232338;
      border: 2px solid #424264;
      color: var(--text-white);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .audio-toggle-btn:hover {
      background: #363654;
      border-color: var(--accent-yellow);
    }

    /* Contenedor Canvas */
    .canvas-container {
      position: relative;
      border: 3px solid #101018;
      border-radius: 8px;
      background: #000;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
      max-width: 100%;
    }

    canvas {
      display: block;
      width: 800px;
      height: 700px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 800 / 700;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Controles Táctiles para Dispositivos Móviles */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      margin-top: 12px;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    @media (max-width: 860px) {
      .mobile-controls {
        display: flex;
      }
      .marquee-title {
        font-size: 11px;
      }
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
    }

    .ctrl-btn {
      background: #222236;
      border: 2px solid #3c3c58;
      color: #fff;
      font-size: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 0 #12121e;
      font-family: inherit;
    }

    .ctrl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #12121e;
      background: #34344e;
    }

    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-center{ grid-column: 2; grid-row: 2; opacity: 0.15; pointer-events: none; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 3; }

    .action-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action-salt {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #e67e22;
      border: 3px solid #f39c12;
      color: #fff;
      font-family: inherit;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-shadow: 0 5px 0 #935116;
      cursor: pointer;
    }

    .btn-action-salt:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #935116;
      background: #d35400;
    }

    .arcade-footer {
      margin-top: 10px;
      font-size: 8.5px;
      color: var(--text-gray);
      text-align: center;
      line-height: 1.5;
    }

    .arcade-footer kbd {
      background: #222236;
      border: 1px solid #3c3c58;
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--accent-yellow);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="arcade-header">
      <div class="marquee-title">★ BURGERTIME ARCADE ★</div>
      <button class="audio-toggle-btn" id="audioToggleBtn" title="Activar/Silenciar Sonido">🔊 SONIDO</button>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="700"></canvas>
    </div>

    <!-- Controles Táctiles para Móviles -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button class="ctrl-btn btn-up" id="btnUp">▲</button>
        <button class="ctrl-btn btn-left" id="btnLeft">◀</button>
        <div class="ctrl-btn btn-center"></div>
        <button class="ctrl-btn btn-right" id="btnRight">▶</button>
        <button class="ctrl-btn btn-down" id="btnDown">▼</button>
      </div>

      <div class="action-group">
        <button class="btn-action-salt" id="btnSalt">
          <span>SAL</span>
          <span style="font-size: 9px;">🧂</span>
        </button>
      </div>
    </div>

    <div class="arcade-footer">
      <kbd>FLECHAS</kbd> o <kbd>WASD</kbd> Moverse & Subir/Bajar Escaleras | <kbd>ESPACIO</kbd> Lanzar Sal | <kbd>1</kbd>/<kbd>2</kbd> Chef | <kbd>R</kbd> Reiniciar
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
