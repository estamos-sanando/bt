<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BurgerTime Arcade 2D</title>
  <meta name="description" content="Juego arcade clásico 2D de BurgerTime fiel al diseño arcade original con 2 hamburguesas completas de 7 ingredientes." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050508;
      --arcade-frame: #0e0e18;
      --accent-yellow: #f8cc1b;
      --accent-red: #ff2222;
      --accent-green: #22ff44;
      --accent-cyan: #00f0ff;
      --text-white: #ffffff;
      --text-gray: #8888a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 6px;
    }

    /* Gabinete Arcade Retro */
    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--arcade-frame);
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 240, 255, 0.15);
      border: 3px solid #1a1a2e;
      max-width: 100%;
    }

    .arcade-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .marquee-title {
      font-size: 14px;
      color: var(--accent-yellow);
      text-shadow: 2px 2px #000, 0 0 8px rgba(248, 204, 27, 0.6);
      letter-spacing: 1px;
    }

    .audio-toggle-btn {
      background: #181828;
      border: 2px solid #333350;
      color: var(--text-white);
      padding: 5px 10px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .audio-toggle-btn:hover {
      background: #25253e;
      border-color: var(--accent-cyan);
    }

    /* Contenedor Canvas Pantalla CRT Arcade */
    .canvas-container {
      position: relative;
      border: 3px solid #000000;
      border-radius: 6px;
      background: #000;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.98), 0 0 12px rgba(0, 240, 255, 0.08);
      max-width: 100%;
    }

    canvas {
      display: block;
      width: 800px;
      height: 860px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 800 / 860;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Controles Táctiles para Móviles */
    .mobile-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      margin-top: 10px;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    @media (max-width: 860px) {
      .mobile-controls {
        display: flex;
      }
      .marquee-title {
        font-size: 10px;
      }
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
    }

    .ctrl-btn {
      background: #18182a;
      border: 2px solid #2e2e4a;
      color: #fff;
      font-size: 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 3px 0 #0a0a14;
      font-family: inherit;
    }

    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0a14;
      background: #2b2b46;
    }

    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-center{ grid-column: 2; grid-row: 2; opacity: 0.1; pointer-events: none; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 3; }

    .action-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action-salt {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #0088b3;
      border: 3px solid var(--accent-cyan);
      color: #fff;
      font-family: inherit;
      font-size: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-shadow: 0 4px 0 #004d66;
      cursor: pointer;
    }

    .btn-action-salt:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #004d66;
      background: #00a3d9;
    }

    .arcade-footer {
      margin-top: 8px;
      font-size: 8px;
      color: var(--text-gray);
      text-align: center;
      line-height: 1.4;
    }

    .arcade-footer kbd {
      background: #18182a;
      border: 1px solid #2e2e4a;
      padding: 2px 4px;
      border-radius: 3px;
      color: var(--accent-yellow);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="arcade-header">
      <div class="marquee-title">★ BURGERTIME ARCADE 1982 ★</div>
      <button class="audio-toggle-btn" id="audioToggleBtn" title="Activar/Silenciar Sonido">🔊 SONIDO</button>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="860"></canvas>
    </div>

    <!-- Controles Táctiles para Móviles -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button class="ctrl-btn btn-up" id="btnUp">▲</button>
        <button class="ctrl-btn btn-left" id="btnLeft">◀</button>
        <div class="ctrl-btn btn-center"></div>
        <button class="ctrl-btn btn-right" id="btnRight">▶</button>
        <button class="ctrl-btn btn-down" id="btnDown">▼</button>
      </div>

      <div class="action-group">
        <button class="btn-action-salt" id="btnSalt">
          <span>SAL</span>
          <span style="font-size: 9px;">🧂</span>
        </button>
      </div>
    </div>

    <div class="arcade-footer">
      <kbd>FLECHAS</kbd> o <kbd>WASD</kbd> Mover / Escaleras | <kbd>ESPACIO</kbd> Lanzar Sal | <kbd>1</kbd>/<kbd>2</kbd> Chef | <kbd>R</kbd> Reiniciar
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
